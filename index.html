    --wa: #25d366;
    --wa-dark: #1ebe5b;
    --border: #dfe4e8;

  @media (prefers-color-scheme: dark) {

      --card: #1c2228;
      --text: #eef2f5;
      --muted: #a3adb6;
      --border: #2c343c;
    }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
  }
  .emoji { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 17px; line-height: 1.6; margin: 0 0 24px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .wa { background: var(--wa); color: #fff; }
  .wa:hover { background: var(--wa-dark); }
  .call { background: transparent; color: var(--text); border: 1px solid var(--border); }
  svg { width: 24px; height: 24px; fill: currentColor; }
</style>
